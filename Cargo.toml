[package]
name = "megara"
version = "2.1.0"
edition = "2021"
description = "Project and global agent harness installer"
license = "MIT"
repository = "https://github.com/the-agentic-world/megara"
autotests = false

[[bin]]
name = "megara"
path = "src/main.rs"

[[test]]
name = "unit"
path = "test/unit/main.rs"

[[test]]
name = "integration"
path = "test/integration/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
unicode-normalization = "0.1"
uuid = { version = "1.20", features = ["v7", "serde"] }
toml_edit = "0.22"
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.53", features = ["rt"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
tempfile = "3"
