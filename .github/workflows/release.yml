name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to recover
        required: true
        type: string
      release_commit:
        description: Expected peeled commit for the immutable release tag
        required: true
        type: string
      release_tag_object:
        description: Recorded immutable annotated tag object SHA
        required: true
        type: string
      main_at_release:
        description: Recorded origin/main SHA when the release tag was created
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_COMMIT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}
      RELEASE_TAG_OBJECT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag_object || '' }}
      RELEASE_MAIN_AT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.main_at_release || '' }}
    outputs:
      release_tag: ${{ steps.resolve-release.outputs.release_tag }}
      release_commit: ${{ steps.resolve-release.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}
          fetch-depth: 0
      - name: Resolve immutable release binding
        id: resolve-release
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          test -n "${RELEASE_TAG}"
          test -n "${RELEASE_COMMIT_INPUT}"

          # actions/checkout can materialize a commit directly at this ref.
          # Remove only that local runner ref before fetching the remote tag
          # object explicitly; this never mutates the remote tag.
          git update-ref -d "${tag_ref}" 2>/dev/null || true
          git fetch --no-tags origin "${tag_ref}:${tag_ref}"

          tag_type="$(git cat-file -t "${tag_ref}")"
          test "${tag_type}" = "tag"
          local_tag_object="$(git rev-parse "${tag_ref}")"
          tag_target="$(git rev-parse "${tag_ref}^{commit}")"
          test "${tag_target}" = "${RELEASE_COMMIT_INPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test -n "${RELEASE_TAG_OBJECT_INPUT}"
            test "${local_tag_object}" = "${RELEASE_TAG_OBJECT_INPUT}"
          else
            test -z "${RELEASE_TAG_OBJECT_INPUT}"
          fi

          remote_refs="$(git ls-remote origin "${tag_ref}" "${tag_ref}^{}")"
          remote_tag_object="$(printf '%s\n' "${remote_refs}" | awk -v ref="${tag_ref}" '$2 == ref {print $1}')"
          remote_tag_target="$(printf '%s\n' "${remote_refs}" | awk -v ref="${tag_ref}^{}" '$2 == ref {print $1}')"
          test -n "${remote_tag_object}"
          test -n "${remote_tag_target}"
          test "${local_tag_object}" = "${remote_tag_object}"
          test "${tag_target}" = "${remote_tag_target}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test "${remote_tag_object}" = "${RELEASE_TAG_OBJECT_INPUT}"
          fi

          git fetch --no-tags origin main
          main_target="$(git rev-parse FETCH_HEAD^{commit})"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test -z "${RELEASE_MAIN_AT_RELEASE}"
            test "${tag_target}" = "${main_target}"
            release_main_at_creation="${main_target}"
          else
            test -n "${RELEASE_MAIN_AT_RELEASE}"
            test "${tag_target}" = "${RELEASE_MAIN_AT_RELEASE}"
            git merge-base --is-ancestor "${tag_target}" "${main_target}"
            release_main_at_creation="${RELEASE_MAIN_AT_RELEASE}"
          fi

          git checkout --detach "${tag_target}"
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_commit=${tag_target}"
            echo "main_at_release=${release_main_at_creation}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "RELEASE_COMMIT=${tag_target}"
            echo "RELEASE_MAIN_AT_CREATION=${release_main_at_creation}"
          } >> "${GITHUB_ENV}"
          echo "tag_type=${tag_type}"
          echo "tag_object=${local_tag_object}"
          echo "release_tag=${RELEASE_TAG}"
          echo "release_commit=${tag_target}"
          echo "main_at_release=${release_main_at_creation}"
          echo "current_main=${main_target}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install canonical Pi host
        shell: bash
        run: |
          set -euo pipefail
          pi_prefix="${RUNNER_TEMP}/megara-pi"
          npm install --prefix "${pi_prefix}" --no-save --no-package-lock @earendil-works/pi-coding-agent@0.80.10
          pi_bin="${pi_prefix}/node_modules/.bin/pi"
          test -x "${pi_bin}"
          test "$("${pi_bin}" --version)" = "0.80.10"
          echo "PI_BIN=${pi_bin}" >> "${GITHUB_ENV}"
          echo "PI_CODING_AGENT_DIR=${RUNNER_TEMP}/megara-pi-agent" >> "${GITHUB_ENV}"
          echo "PI_OFFLINE=1" >> "${GITHUB_ENV}"
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "${RELEASE_TAG}" = "v${version}"
      - name: Build release evidence bundle
        env:
          RELEASE_COMMIT: ${{ steps.resolve-release.outputs.release_commit }}
          MEGARA_EVIDENCE_ROOT: target/megara-evidence/${{ steps.resolve-release.outputs.release_commit }}
        run: ./scripts/release-evidence.sh
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: megara-planning-release-evidence-${{ steps.resolve-release.outputs.release_commit }}
          path: target/megara-evidence/${{ steps.resolve-release.outputs.release_commit }}
          retention-days: 90
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/megara"
          "$bin" --version
          "$bin" targets list --json | grep -q '"name": "codex"'
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="megara-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p "dist/megara-v${version}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/megara" "dist/megara-v${version}-${{ matrix.target }}/"
          tar -C "dist/megara-v${version}-${{ matrix.target }}" -czf "${archive}" "megara"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${archive}" > "${archive}.sha256"
          else
            sha256sum "${archive}" > "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: megara-${{ matrix.target }}
          path: |
            megara-v*.tar.gz
            megara-v*.tar.gz.sha256

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [verify, build]
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets before publish
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          targets=(
            "aarch64-apple-darwin"
            "x86_64-unknown-linux-gnu"
          )
          for target in "${targets[@]}"; do
            archive="megara-v${version}-${target}.tar.gz"
            test -s "dist/${archive}"
            test -s "dist/${archive}.sha256"
            if command -v shasum >/dev/null 2>&1; then
              (cd dist && shasum -a 256 -c "${archive}.sha256")
            else
              (cd dist && sha256sum -c "${archive}.sha256")
            fi
            tar -tzf "dist/${archive}" | grep -qx "megara"
          done
          cp install.sh dist/install.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          fail_on_unmatched_files: true
          files: |
            dist/megara-v*.tar.gz
            dist/megara-v*.tar.gz.sha256
            dist/install.sh

  smoke-install:
    name: Smoke install (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [verify, publish]
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Install from published release script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/install.sh" -o "${RUNNER_TEMP}/install.sh"
          MEGARA_VERSION="${RELEASE_TAG}" MEGARA_INSTALL_DIR="${RUNNER_TEMP}/bin" sh "${RUNNER_TEMP}/install.sh"
          "${RUNNER_TEMP}/bin/megara" --version
          "${RUNNER_TEMP}/bin/megara" targets list --json | grep -q '"name": "codex"'
          "${RUNNER_TEMP}/bin/megara" targets list --json | grep -q '"name": "pi"'
      - name: Install Pi harness from published release script
        shell: bash
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/pi-project"
          mkdir -p "${project}"
          cd "${project}"
          "${RUNNER_TEMP}/bin/megara" install --scope project --target pi --trust-project --no-interactive
          test -f .pi/extensions/megara.ts
          test -f .pi/megara_process.ts
          test -f .pi/agents/executor.md
          grep -q 'planning_start' .pi/extensions/megara.ts
          grep -q 'megara-purge' .pi/extensions/megara.ts
          test ! -e .codex/hooks.json
          mkdir -p .megara/state
          touch .megara/state/recovery.json
          "${RUNNER_TEMP}/bin/megara" uninstall --scope project --target pi
          test ! -e .pi/extensions/megara.ts
          test ! -e .pi/megara_process.ts
          test ! -e .agents/megara.toml
          test -f .megara/state/recovery.json
      - name: Install Codex harness from published release script
        shell: bash
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/codex-project"
          codex_home="${RUNNER_TEMP}/codex-home"
          codex_runtime="${RUNNER_TEMP}/codex-runtime"
          mkdir -p "${codex_runtime}"
          printf '%s\n' \
            '#!/usr/bin/env sh' \
            'case "$1:$2" in' \
            '  --version:) printf "%s\\n" "codex-cli 0.148.0" ;;' \
            '  features:list) printf "%s\\n" "multi_agent stable true" "default_mode_request_user_input under development false" ;;' \
            '  *) exit 2 ;;' \
            'esac' > "${codex_runtime}/codex"
          chmod +x "${codex_runtime}/codex"
          mkdir -p "${project}"
          cd "${project}"
          PATH="${codex_runtime}:${PATH}" CODEX_HOME="${codex_home}" "${RUNNER_TEMP}/bin/megara" install --scope project --target codex --trust-project --no-interactive
          test -f .codex/AGENTS.md
          test -f .codex/agents/executor.toml
          test -f .codex/config.toml
          grep -q 'megara_planning' .codex/config.toml
          grep -q 'default_mode_request_user_input = true' .codex/config.toml
          grep -q 'Planning state is owned' .codex/AGENTS.md
          grep -q 'trust_level = "trusted"' "${codex_home}/config.toml"
          test ! -e .codex/hooks.json
          if test -f "${codex_home}/config.toml"; then
            ! grep -q 'post_tool_use' "${codex_home}/config.toml"
          fi
          PATH="${codex_runtime}:${PATH}" CODEX_HOME="${codex_home}" "${RUNNER_TEMP}/bin/megara" doctor --scope project --target codex --json
          mkdir -p .megara/state
          touch .megara/state/recovery.json
          PATH="${codex_runtime}:${PATH}" CODEX_HOME="${codex_home}" "${RUNNER_TEMP}/bin/megara" uninstall --scope project --target codex
          test ! -e .codex/AGENTS.md
          test ! -e .codex/agents/executor.toml
          ! grep -q 'megara_planning' .codex/config.toml
          ! grep -q 'default_mode_request_user_input' .codex/config.toml
          test ! -e .codex/hooks.json
          test ! -e .agents/megara.toml
          test -f .megara/state/recovery.json
          ! grep -q 'post_tool_use' "${codex_home}/config.toml"
      - name: Install with default fallback path
        shell: bash
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP}/home-fallback"
          mkdir -p "${home}/.local/bin"
          chmod a-w "${home}/.local/bin"
          HOME="${home}" MEGARA_VERSION="${RELEASE_TAG}" MEGARA_SKIP_LEGACY_CLEANUP=1 sh "${RUNNER_TEMP}/install.sh"
          "${home}/bin/megara" --version
          "${home}/bin/megara" targets list --json | grep -q '"name": "codex"'
      - name: Install with legacy update fallback path
        shell: bash
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP}/home-explicit-fallback"
          blocked="${RUNNER_TEMP}/blocked-bin"
          mkdir -p "${home}/.local/bin" "${blocked}"
          chmod a-w "${blocked}"
          HOME="${home}" MEGARA_VERSION="${RELEASE_TAG}" MEGARA_INSTALL_DIR="${blocked}" MEGARA_SKIP_LEGACY_CLEANUP=1 sh "${RUNNER_TEMP}/install.sh"
          "${home}/.local/bin/megara" --version
          "${home}/.local/bin/megara" targets list --json | grep -q '"name": "codex"'

  prune-releases:
    name: Keep latest 5 releases
    runs-on: ubuntu-latest
    needs: smoke-install
    timeout-minutes: 10
    steps:
      - name: Delete older GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t old_tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .published_at != null) | [.published_at, .tag_name] | @tsv' |
              sort -r |
              awk -F '\t' 'NR > 5 {print $2}'
          )

          if ((${#old_tags[@]} == 0)); then
            echo "No old releases to delete."
            exit 0
          fi

          echo "Deleting old releases, keeping 5 newest:"
          printf ' - %s\n' "${old_tags[@]}"
          for tag in "${old_tags[@]}"; do
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes
          done

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [verify, smoke-install]
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: the-agentic-world/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          repo="${GITHUB_REPOSITORY}"
          arm_archive="megara-v${version}-aarch64-apple-darwin.tar.gz"
          arm_sha="$(cut -d ' ' -f 1 "dist/${arm_archive}.sha256")"
          mkdir -p tap/Formula
          cat > tap/Formula/megara.rb <<RUBY
          class Megara < Formula
            desc "Project and global agent harness installer"
            homepage "https://github.com/${repo}"
            version "${version}"
            license "MIT"

            on_macos do
              url "https://github.com/${repo}/releases/download/v${version}/${arm_archive}"
              sha256 "${arm_sha}"
            end

            def install
              bin.install "megara"
            end

            test do
              assert_match "codex", shell_output("#{bin}/megara targets list")
            end
          end
          RUBY
      - name: Commit formula
        shell: bash
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/megara.rb
          git commit -m "megara ${RELEASE_TAG}" || exit 0
          git push
